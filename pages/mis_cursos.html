<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Cursos - Con Tribu Ir</title>
    <link rel="stylesheet" href="../Css/mis_cursos.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-button">← Volver al inicio</a>

        <div class="header">
            <h1>📚 Mis Cursos</h1>
            <p>Gestiona tus inscripciones y continúa aprendiendo</p>
            <div class="tabs">
                <button class="tab-btn" onclick="filterCourses('activos', this)">En Progreso</button>
                <button class="tab-btn" onclick="filterCourses('completados', this)">Completados</button>
                <button class="tab-btn active" onclick="filterCourses('todos', this)">Todos</button>
                <button class="tab-btn" onclick="filterCourses('publicados', this)" id="tab-publicados" style="display:none;">Publicados 📝</button>
                <button class="tab-btn" onclick="filterCourses('favoritos', this)">Favoritos ❤️</button>
            </div>
        </div>

        <div id="coursesContainer" class="courses-grid">
            <div class="loading">
                <p>⏳ Cargando tus cursos...</p>
            </div>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📖</div>
            <h2>No tienes cursos aún</h2>
            <p>Comienza tu viaje de aprendizaje hoy mismo</p>
            <a href="../index.html#cursos" class="btn-explore">Explorar Cursos</a>
        </div>
    </div>

    <script>
        let allEnrollments = [];
        let allCourses = [];
        let currentFilter = 'todos';
        let currentUserId = null;
        let favorites = JSON.parse(localStorage.getItem('contribuir_favorites') || '[]');

        // Función para convertir rutas relativas a absolutas
        function fixImagePath(path) {
            if (!path) return '/photos/default.png';
            // Si ya es una ruta absoluta o URL, devolverla sin cambios
            if (path.startsWith('/') || path.startsWith('http')) {
                return path;
            }
            // Si contiene ../, devolverla sin cambios
            if (path.includes('../')) {
                return path;
            }
            // Convertir a ruta absoluta
            return '/' + path;
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadEnrollments();
        });

        async function loadEnrollments() {
            let sessionResponse, enrollmentsResponse, coursesResponse;
            try {
                sessionResponse = await fetch('../api/check_session.php', { credentials: 'same-origin' });
                if (!sessionResponse.ok) throw new Error('No autenticado');
                
                const sessionData = await sessionResponse.json();
                currentUserId = sessionData.user_id;

                // Mostrar tab "Publicados" solo si no es student
                if (sessionData.role !== 'student') {
                    const publishedTab = document.getElementById('tab-publicados');
                    if (publishedTab) publishedTab.style.display = 'inline-block';
                }

                enrollmentsResponse = await fetch('../api/get_enrollments.php', { credentials: 'same-origin' });
                if (!enrollmentsResponse.ok) throw new Error('Error al cargar cursos');
                
                coursesResponse = await fetch('../api/get_courses.php', { credentials: 'same-origin' });
                if (!coursesResponse.ok) throw new Error('Error al cargar todos los cursos');

                allEnrollments = await enrollmentsResponse.json();
                allCourses = await coursesResponse.json();
                
                allCourses = allCourses.map(course => ({
                    ...course,
                    progress: course.progress || 0,
                    enrolledDate: course.created_at || course.enrolledDate || 'No disponible'
                }));
                
                console.log('✅ Total de cursos inscritos:', allEnrollments.length);
                console.log('✅ Total de todos los cursos:', allCourses.length);
                console.log('👤 ID del usuario logeado:', currentUserId);
                console.log('📋 Todos los cursos:', allCourses);
                filterCourses('todos');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('coursesContainer').innerHTML = '';
                document.getElementById('emptyState').innerHTML = `
                    <div class="empty-state-icon">ERROR</div>
                    <h2>Error al cargar tus cursos</h2>
                    <p>Error: ${error.message}</p>
                    <p>Por favor, vuelve al inicio e inicia sesión.</p>
                    <a href="../index.html" class="btn-explore">Volver al inicio</a>
                `;
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        function filterCourses(filter, buttonElement) {
            currentFilter = filter;
            if (buttonElement) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }

            let filtered = [];
            if (filter === 'activos') filtered = allEnrollments.filter(e => e.progress < 100);
            else if (filter === 'completados') filtered = allEnrollments.filter(e => e.progress === 100);
            else if (filter === 'favoritos') filtered = allEnrollments.filter(e => favorites.includes(e.id));
            else if (filter === 'publicados') {
                filtered = allCourses.filter(c => {
                    const cursoId = parseInt(c.instructor_id) || 0;
                    const usuarioActual = parseInt(currentUserId) || 0;
                    return cursoId === usuarioActual;
                });
                console.log('🔍 Filtrando publicados - ID usuario:', currentUserId, 'instructor_ids en cursos:', allCourses.map(c => c.instructor_id), 'Resultados:', filtered);
            }
            else filtered = allEnrollments;

            displayCourses(filtered);
        }

        function displayCourses(courses) {
            const container = document.getElementById('coursesContainer');
            const emptyState = document.getElementById('emptyState');

            if (courses.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';

                let message = 'No tienes cursos en esta categoría.';
                if (currentFilter === 'favoritos') message = 'Aún no has marcado ningún curso como favorito ❤️';
                else if (currentFilter === 'activos') message = '✨ ¡No hay cursos en progreso! Todos completados o sin empezar.';
                else if (currentFilter === 'completados') message = '¡Termina un curso para verlo aquí!';
                else if (currentFilter === 'publicados') message = '📝 Aún no has publicado ningún curso como instructor.';
                else if (currentFilter === 'todos' && allEnrollments.length === 0) message = '📖 No tienes ningún curso aún. ¡Inscríbete en uno!';

                emptyState.innerHTML = `
                    <div class="empty-state-icon">📖</div>
                    <h2>${message}</h2>
                    <p>Explora nuestra oferta educativa</p>
                    <a href="../index.html#cursos" class="btn-explore">Explorar Cursos</a>
                `;
                return;
            }

            container.style.display = 'grid';
            emptyState.style.display = 'none';
            console.log(`Mostrando ${courses.length} curso(s) con filtro: ${currentFilter}`);

            container.innerHTML = courses.map(course => {
                const isFavorite = favorites.includes(course.id);
                const imageSrc = course.image.startsWith('http') || course.image.startsWith('/') ? course.image : '../' + course.image;
                const isPublished = currentFilter === 'publicados';
                
                return `
                    <div class="course-card">
                        <img src="${imageSrc}" alt="${course.title}" class="course-image" onerror="this.onerror=null;this.src='../photos/LogoOficial.png';">
                        ${!isPublished ? `<button class="favorite-btn ${isFavorite ? 'favorited' : ''}" onclick="toggleFavorite(${course.id}, event)">
                            ${isFavorite ? '❤️' : '🤍'}
                        </button>` : ''}

                        <div class="course-body">
                            <div class="course-header">
                                <div>
                                    <h3 class="course-title">${course.title}</h3>
                                    <p class="course-instructor">por ${course.instructor}</p>
                                </div>
                                ${!isPublished && course.progress === 100 ? '<span class="badge completed">✓ Completado</span>' : ''}
                            </div>

                            ${!isPublished ? `
                                <div class="progress-section">
                                    <div class="progress-label">
                                        <span>Progreso</span>
                                        <span>${course.progress}%</span>
                                    </div>
                                    <div class="progress-bar">
                                        <div class="progress-fill" style="width: ${course.progress}%"></div>
                                    </div>
                                </div>

                                <div class="course-stats">
                                    <div class="stat-item">📅 ${course.enrolledDate}</div>
                                </div>
                            ` : ''}

                            <div class="course-actions-row">
                                ${isPublished ? `
                                    <button onclick="editarCurso(${course.id})" class="btn btn-secondary">
                                        Editar Curso
                                    </button>
                                ` : `
                                    <a href="../pages/curso2.html?id=${course.id}" class="btn btn-primary">
                                        ${course.progress === 100 ? 'Revisar' : 'Continuar'} →
                                    </a>
                                `}
                                <a href="../pages/curso2.html?id=${course.id}" class="btn btn-secondary">
                                    Detalles
                                </a>
                            </div>

                            ${!isPublished && course.progress === 100 ? `
                                <button class="btn btn-certificate" onclick="downloadCertificate(${course.id}, '${course.title.replace(/'/g, "\\'")}')">
                                    📜 Descargar Certificado
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFavorite(courseId, event) {
            event.stopPropagation();
            if (favorites.includes(courseId)) {
                favorites = favorites.filter(id => id !== courseId);
            } else {
                favorites.push(courseId);
            }
            localStorage.setItem('contribuir_favorites', JSON.stringify(favorites));

            const button = event.target;
            button.innerHTML = favorites.includes(courseId) ? '❤️' : '🤍';
            button.classList.toggle('favorited', favorites.includes(courseId));

            if (currentFilter === 'favoritos') {
                filterCourses('favoritos');
            }
        }

        function editarCurso(courseId) {
            window.location.href = `../ModeladoHTML/create_edit_course_config.html?id=${courseId}`;
        }

        function downloadCertificate(courseId, courseTitle) {
            const certificateUrl = '../certificados/certificado-ejemplo.pdf';
            const link = document.createElement('a');
            link.href = certificateUrl;
            link.download = `Certificado - ${courseTitle}.pdf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert(`🎉 ¡Descargando certificado de "${courseTitle}"!`);
        }
    </script>
</body>
</html>
