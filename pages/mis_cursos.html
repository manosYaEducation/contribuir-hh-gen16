<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Cursos - Con Tribu Ir</title>
    <link rel="stylesheet" href="../Css/mis_cursos.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-button">← Volver al inicio</a>

        <div class="header">
            <h1>📚 Mis Cursos</h1>
            <p>Gestiona tus inscripciones y continúa aprendiendo</p>
            <div class="tabs">
                <button class="tab-btn active" onclick="filterCourses('activos', this)">En Progreso</button>
                <button class="tab-btn" onclick="filterCourses('completados', this)">Completados</button>
                <button class="tab-btn" onclick="filterCourses('todos', this)">Todos</button>
                <button class="tab-btn" onclick="filterCourses('favoritos', this)">Favoritos ❤️</button>
            </div>
        </div>

        <div id="coursesContainer" class="courses-grid">
            <div class="loading">
                <p>⏳ Cargando tus cursos...</p>
            </div>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📖</div>
            <h2>No tienes cursos aún</h2>
            <p>Comienza tu viaje de aprendizaje hoy mismo</p>
            <a href="../index.html#cursos" class="btn-explore">Explorar Cursos</a>
        </div>
    </div>

    <script>
        let allEnrollments = [];
        let currentFilter = 'activos';
        let favorites = JSON.parse(localStorage.getItem('contribuir_favorites') || '[]');

        document.addEventListener('DOMContentLoaded', function() {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                console.log('🔧 Modo prueba local activado');
                useMockData();
            } else {
                loadEnrollments();
            }
        });

        function useMockData() {
            allEnrollments = [
                { id: 1, enrollmentId: 101, title: "Metodologías Innovadoras: De la Teoría a la Práctica", instructor: "Prof. Mauricio Paredes", image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80", progress: 0, enrolledDate: "05/11/2025", hoursCompleted: "0", totalHours: "30" },
                { id: 2, enrollmentId: 102, title: "Formación de Artistas Educadores", instructor: "Con Tribu Ir", image: "https://i.ibb.co/84Kf9Rd0/552183644-17852106906549939-7631989156897828754-n.webp", progress: 45, enrolledDate: "24/10/2025", hoursCompleted: "12", totalHours: "28" },
                { id: 3, enrollmentId: 104, title: "Mindfulness en el Aula", instructor: "Lic. Ana Rivera", image: "https://images.unsplash.com/photo-1509062522246-3755977927d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80", progress: 72, enrolledDate: "10/12/2025", hoursCompleted: "18", totalHours: "25" }
            ];

            filterCourses('activos');
        }

        async function loadEnrollments() {
            let sessionResponse, enrollmentsResponse;
            try {
                sessionResponse = await fetch('../api/check_session.php', { credentials: 'same-origin' });
                if (!sessionResponse.ok) throw new Error('No autenticado');

                enrollmentsResponse = await fetch('../api/get_enrollments.php', { credentials: 'same-origin' });
                if (!enrollmentsResponse.ok) throw new Error('Error al cargar cursos');

                allEnrollments = await enrollmentsResponse.json();
                filterCourses('activos');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('coursesContainer').innerHTML = '';
                document.getElementById('emptyState').innerHTML = `
                    <div class="empty-state-icon">⚠️</div>
                    <h2>No se pudieron cargar los cursos</h2>
                    <p>Por favor, vuelve al inicio e inicia sesión.</p>
                    <a href="../index.html" class="btn-explore">Volver al inicio</a>
                `;
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        function filterCourses(filter, buttonElement) {
            currentFilter = filter;
            if (buttonElement) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }

            let filtered = [];
            if (filter === 'activos') filtered = allEnrollments.filter(e => e.progress < 100);
            else if (filter === 'completados') filtered = allEnrollments.filter(e => e.progress === 100);
            else if (filter === 'favoritos') filtered = allEnrollments.filter(e => favorites.includes(e.id));
            else filtered = allEnrollments;

            displayCourses(filtered);
        }

        function displayCourses(courses) {
            const container = document.getElementById('coursesContainer');
            const emptyState = document.getElementById('emptyState');

            if (courses.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';

                let message = 'No tienes cursos en esta categoría.';
                if (currentFilter === 'favoritos') message = 'Aún no has marcado ningún curso como favorito ❤️';
                else if (currentFilter === 'activos') message = '¡Inscríbete en un curso para comenzar!';
                else if (currentFilter === 'completados') message = '¡Termina un curso para verlo aquí!';

                emptyState.innerHTML = `
                    <div class="empty-state-icon">📖</div>
                    <h2>${message}</h2>
                    <p>Explora nuestra oferta educativa</p>
                    <a href="../index.html#cursos" class="btn-explore">Explorar Cursos</a>
                `;
                return;
            }

            container.style.display = 'grid';
            emptyState.style.display = 'none';

            container.innerHTML = courses.map(course => {
                const isFavorite = favorites.includes(course.id);
                return `
                    <div class="course-card">
                        <img src="${course.image}" alt="${course.title}" class="course-image">
                        <button class="favorite-btn ${isFavorite ? 'favorited' : ''}" onclick="toggleFavorite(${course.id}, event)">
                            ${isFavorite ? '❤️' : '🤍'}
                        </button>

                        <div class="course-body">
                            <div class="course-header">
                                <div>
                                    <h3 class="course-title">${course.title}</h3>
                                    <p class="course-instructor">por ${course.instructor}</p>
                                </div>
                                ${course.progress === 100 ? '<span class="badge completed">✓ Completado</span>' : ''}
                            </div>

                            <div class="progress-section">
                                <div class="progress-label">
                                    <span>Progreso</span>
                                    <span>${course.progress}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${course.progress}%"></div>
                                </div>
                            </div>

                            <div class="course-stats">
                                <div class="stat-item">📅 ${course.enrolledDate}</div>
                                <div class="stat-item">⏱️ ${course.hoursCompleted}h${course.totalHours ? '/' + course.totalHours + 'h' : ''}</div>
                            </div>

                            <div class="course-actions-row">
                                <a href="../pages/curso2.html?id=${course.id}" class="btn btn-primary">   <!-- Cambiar URL para cuando apretemos continuar y nos mande a otra pantalla del curso  -->
                                    ${course.progress === 100 ? 'Revisar' : 'Continuar'} →
                                </a>
                                <a href="../pages/curso2.html?id=${course.id}" class="btn btn-secondary">
                                    Detalles
                                </a>
                            </div>

                            ${course.progress === 100 ? `
                                <button class="btn btn-certificate" onclick="downloadCertificate(${course.id}, '${course.title.replace(/'/g, "\\'")}')">
                                    📜 Descargar Certificado
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFavorite(courseId, event) {
            event.stopPropagation();
            if (favorites.includes(courseId)) {
                favorites = favorites.filter(id => id !== courseId);
            } else {
                favorites.push(courseId);
            }
            localStorage.setItem('contribuir_favorites', JSON.stringify(favorites));

            const button = event.target;
            button.innerHTML = favorites.includes(courseId) ? '❤️' : '🤍';
            button.classList.toggle('favorited', favorites.includes(courseId));

            if (currentFilter === 'favoritos') {
                filterCourses('favoritos');
            }
        }

        function downloadCertificate(courseId, courseTitle) {
            const certificateUrl = '../certificados/certificado-ejemplo.pdf';
            const link = document.createElement('a');
            link.href = certificateUrl;
            link.download = `Certificado - ${courseTitle}.pdf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert(`🎉 ¡Descargando certificado de "${courseTitle}"!`);
        }
    </script>
</body>
</html>
