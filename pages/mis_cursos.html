<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Cursos - Con Tribu Ir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(90deg, #1d3d59 1%, #fdf4a0 99%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #e0e0e0;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .course-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .course-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(90deg, #1d3d59 10%, #fdf4a0 45%);
        }

        .course-body {
            padding: 1.5rem;
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
            position: relative;
        }

        .course-title {
            color: #333;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            flex: 1;
        }

        .course-instructor {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .progress-section {
            margin: 1rem 0;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #054581f8 0%, #d8cd6e 70%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .course-stats {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #666;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .course-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .course-actions-row {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #24378d 0%, #24378d 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-certificate {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
        }

        .btn-certificate:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(45, 55, 68, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h2 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            margin-bottom: 1.5rem;
        }

        .btn-explore {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #1d3d59 0%, #d8cd6e 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge.completed {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
        }

        .favorite-btn.favorited {
            background: #ffebee;
            color: #e53e3e;
        }

        @media (max-width: 768px) {
            .courses-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-wrap: wrap;
            }

            body {
                padding: 1rem;
            }

            .header {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-button">← Volver al inicio</a>

        <div class="header">
            <h1>📚 Mis Cursos</h1>
            <p>Gestiona tus inscripciones y continúa aprendiendo</p>
            <div class="tabs">
                <button class="tab-btn active" onclick="filterCourses('activos', this)">En Progreso</button>
                <button class="tab-btn" onclick="filterCourses('completados', this)">Completados</button>
                <button class="tab-btn" onclick="filterCourses('todos', this)">Todos</button>
                <button class="tab-btn" onclick="filterCourses('favoritos', this)">Favoritos ❤️</button>
            </div>
        </div>

        <div id="coursesContainer" class="courses-grid">
            <div class="loading">
                <p>⏳ Cargando tus cursos...</p>
            </div>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📖</div>
            <h2>No tienes cursos aún</h2>
            <p>Comienza tu viaje de aprendizaje hoy mismo</p>
            <a href="../index.html#cursos" class="btn-explore">Explorar Cursos</a>
        </div>
    </div>

    <script>
        let allEnrollments = [];
        let currentFilter = 'activos';
        let favorites = JSON.parse(localStorage.getItem('contribuir_favorites') || '[]');

        document.addEventListener('DOMContentLoaded', function() {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                console.log('🔧 Modo prueba local activado');
                useMockData();
            } else {
                loadEnrollments();
            }
        });

        function useMockData() {
            allEnrollments = [
                { id: 1, enrollmentId: 101, title: "Metodologías Innovadoras: De la Teoría a la Práctica", instructor: "Prof. Mauricio Paredes", image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80", progress: 0, enrolledDate: "05/11/2025", hoursCompleted: "0", totalHours: "30" },
                { id: 2, enrollmentId: 102, title: "Formación de Artistas Educadores", instructor: "Con Tribu Ir", image: "https://i.ibb.co/84Kf9Rd0/552183644-17852106906549939-7631989156897828754-n.webp", progress: 45, enrolledDate: "24/10/2025", hoursCompleted: "12", totalHours: "28" },
                { id: 3, enrollmentId: 104, title: "Mindfulness en el Aula", instructor: "Lic. Ana Rivera", image: "https://images.unsplash.com/photo-1509062522246-3755977927d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80", progress: 72, enrolledDate: "10/12/2025", hoursCompleted: "18", totalHours: "25" }
            ];
            filterCourses('activos');
        }

        async function loadEnrollments() {
            let sessionResponse, enrollmentsResponse;
            try {
                sessionResponse = await fetch('../api/check_session.php', { credentials: 'same-origin' });
                if (!sessionResponse.ok) throw new Error('No autenticado');

                enrollmentsResponse = await fetch('../api/get_enrollments.php', { credentials: 'same-origin' });
                if (!enrollmentsResponse.ok) throw new Error('Error al cargar cursos');

                allEnrollments = await enrollmentsResponse.json();
                filterCourses('activos');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('coursesContainer').innerHTML = '';
                document.getElementById('emptyState').innerHTML = `
                    <div class="empty-state-icon">⚠️</div>
                    <h2>No se pudieron cargar los cursos</h2>
                    <p>Por favor, vuelve al inicio e inicia sesión.</p>
                    <a href="../index.html" class="btn-explore">Volver al inicio</a>
                `;
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        function filterCourses(filter, buttonElement) {
            currentFilter = filter;
            if (buttonElement) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }

            let filtered = [];
            if (filter === 'activos') filtered = allEnrollments.filter(e => e.progress < 100);
            else if (filter === 'completados') filtered = allEnrollments.filter(e => e.progress === 100);
            else if (filter === 'favoritos') filtered = allEnrollments.filter(e => favorites.includes(e.id));
            else filtered = allEnrollments;

            displayCourses(filtered);
        }

        function displayCourses(courses) {
            const container = document.getElementById('coursesContainer');
            const emptyState = document.getElementById('emptyState');

            if (courses.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';

                let message = 'No tienes cursos en esta categoría.';
                if (currentFilter === 'favoritos') message = 'Aún no has marcado ningún curso como favorito ❤️';
                else if (currentFilter === 'activos') message = '¡Inscríbete en un curso para comenzar!';
                else if (currentFilter === 'completados') message = '¡Termina un curso para verlo aquí!';

                emptyState.innerHTML = `
                    <div class="empty-state-icon">📖</div>
                    <h2>${message}</h2>
                    <p>Explora nuestra oferta educativa</p>
                    <a href="../index.html#cursos" class="btn-explore">Explorar Cursos</a>
                `;
                return;
            }

            container.style.display = 'grid';
            emptyState.style.display = 'none';

            container.innerHTML = courses.map(course => {
                const isFavorite = favorites.includes(course.id);
                return `
                    <div class="course-card">
                        <img src="${course.image}" alt="${course.title}" class="course-image">
                        <button class="favorite-btn ${isFavorite ? 'favorited' : ''}" onclick="toggleFavorite(${course.id}, event)">
                            ${isFavorite ? '❤️' : '🤍'}
                        </button>

                        <div class="course-body">
                            <div class="course-header">
                                <div>
                                    <h3 class="course-title">${course.title}</h3>
                                    <p class="course-instructor">por ${course.instructor}</p>
                                </div>
                                ${course.progress === 100 ? '<span class="badge completed">✓ Completado</span>' : ''}
                            </div>

                            <div class="progress-section">
                                <div class="progress-label">
                                    <span>Progreso</span>
                                    <span>${course.progress}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${course.progress}%"></div>
                                </div>
                            </div>

                            <div class="course-stats">
                                <div class="stat-item">📅 ${course.enrolledDate}</div>
                                <div class="stat-item">⏱️ ${course.hoursCompleted}h${course.totalHours ? '/' + course.totalHours + 'h' : ''}</div>
                            </div>

                            <div class="course-actions-row">
                                <a href="../ModeladoHTML/curso.html?id=${course.id}" class="btn btn-primary">   <!-- Cambiar URL para cuando apretemos continuar y nos mande a otra pantalla del curso  -->
                                    ${course.progress === 100 ? 'Revisar' : 'Continuar'} →
                                </a>
                                <a href="../ModeladoHTML/curso.html?id=${course.id}" class="btn btn-secondary">
                                    Detalles
                                </a>
                            </div>

                            ${course.progress === 100 ? `
                                <button class="btn btn-certificate" onclick="downloadCertificate(${course.id}, '${course.title.replace(/'/g, "\\'")}')">
                                    📜 Descargar Certificado
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFavorite(courseId, event) {
            event.stopPropagation();
            if (favorites.includes(courseId)) {
                favorites = favorites.filter(id => id !== courseId);
            } else {
                favorites.push(courseId);
            }
            localStorage.setItem('contribuir_favorites', JSON.stringify(favorites));

            const button = event.target;
            button.innerHTML = favorites.includes(courseId) ? '❤️' : '🤍';
            button.classList.toggle('favorited', favorites.includes(courseId));

            if (currentFilter === 'favoritos') {
                filterCourses('favoritos');
            }
        }

        function downloadCertificate(courseId, courseTitle) {
            const certificateUrl = '../certificados/certificado-ejemplo.pdf';
            const link = document.createElement('a');
            link.href = certificateUrl;
            link.download = `Certificado - ${courseTitle}.pdf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert(`🎉 ¡Descargando certificado de "${courseTitle}"!`);
        }
    </script>
</body>
</html>
